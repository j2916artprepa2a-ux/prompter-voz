name: App Android (APK)
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        id: build
        run: |
          set -o pipefail
          gradle -p android assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Publicar APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk TexJAHC.apk
          ls -la TexJAHC.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest TexJAHC.apk \
            --title "TexJAHC para Android (cuadrito flotante)" \
            --notes "Descarga TexJAHC.apk en tu Android e instálalo. Versión ${{ github.run_number }}." \
            --latest
          # También en la página: j2916artprepa2a-ux.github.io/prompter-voz/descargas/TexJAHC.apk
          mkdir -p descargas && cp TexJAHC.apk descargas/TexJAHC.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/TexJAHC.apk
          git commit -m "APK Android v${{ github.run_number }} [skip ci]" || true
          git push || true
      - name: Guardar error de compilación
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "sin log" > /tmp/build.log
          git checkout --orphan build-logs
          git rm -rf . -q || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Log de compilación ${{ github.run_number }}"
          git push -f origin build-logs
